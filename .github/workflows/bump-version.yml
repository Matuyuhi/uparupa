name: bump-version

# Bumps .version in build.zig.zon and commits it to main. Nothing else changes.
# main takes only commits that test.yml's lockfile and test passed on (the "main PR" ruleset). A push with the
# workflow's own token starts no workflow, so the commit goes to a branch and test.yml is run on it by hand (which that
# token may do). Checks from a workflow_dispatch run do not count for the ruleset (GitHub's "Troubleshooting required
# status checks"), so once both pass, their results are set on the commit as commit statuses of the same names, which
# do, and main moves to it.
# release.yml calls this after each release with part=patch, so main always holds the next version.
# It also keeps one open milestone named after the version on main: it closes the milestone of the version just
# released, or renames the open one when a minor or major bump comes before its release, then makes sure one named
# after the new version exists.
# Run it by hand (gh workflow run bump-version.yml -f part=minor) to move to a new minor or major version.
on:
  workflow_dispatch:
    inputs:
      part:
        description: Which part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch
  workflow_call:
    inputs:
      part:
        type: string
        default: patch

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write
      statuses: write
      issues: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Bump the version in build.zig.zon
        env:
          PART: ${{ inputs.part }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(sed -n 's/.*\.version = "\([0-9]*\.[0-9]*\.[0-9]*\)".*/\1/p' build.zig.zon)"
          [ -n "$current" ] || { echo "Cannot read the version from build.zig.zon"; exit 1; }
          major="${current%%.*}"; rest="${current#*.}"; minor="${rest%%.*}"; patch="${rest#*.}"
          case "$PART" in
            major) next="$((major + 1)).0.0" ;;
            minor) next="$major.$((minor + 1)).0" ;;
            patch) next="$major.$minor.$((patch + 1))" ;;
            *) echo "part must be patch, minor or major: $PART"; exit 1 ;;
          esac
          # Look at the milestones before main moves, so that a rename that cannot be done stops the bump.
          api="repos/$GITHUB_REPOSITORY/milestones"
          number="$(gh api --paginate "$api?state=open&per_page=100" --jq ".[] | select(.title == \"$current\") | .number")"
          next_number="$(gh api --paginate "$api?state=all&per_page=100" --jq ".[] | select(.title == \"$next\") | .number")"
          released=""
          gh release view "v$current" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 && released=yes
          if [ -n "$number" ] && [ -n "$next_number" ] && [ -z "$released" ]; then
            echo "Milestone $next already exists. Move the items of milestone $current to it and close $current first"; exit 1
          fi
          sed "s/\.version = \"$current\"/.version = \"$next\"/" build.zig.zon > build.zig.zon.new
          mv build.zig.zon.new build.zig.zon
          git diff --exit-code --quiet build.zig.zon && { echo "build.zig.zon did not change"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bump version to $next" build.zig.zon
          branch="bump-version/$next"
          git push origin "HEAD:refs/heads/$branch"
          trap 'git push origin --delete "$branch"' EXIT
          gh workflow run test.yml --ref "$branch"
          sha="$(git rev-parse HEAD)"
          for check in lockfile test; do
            while :; do
              result="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?check_name=$check" \
                --jq '.check_runs[0] | select(.status == "completed") | .conclusion' || true)"
              [ -n "$result" ] && break
              sleep 30
            done
            [ "$result" = success ] || { echo "$check: $result"; exit 1; }
            gh api "repos/$GITHUB_REPOSITORY/statuses/$sha" -f state=success -f context="$check" --silent
          done
          git push origin HEAD:main
          echo "$current -> $next"
          if [ -n "$number" ] && [ -z "$released" ]; then
            gh api -X PATCH "$api/$number" -f title="$next" --silent
          else
            [ -z "$number" ] || gh api -X PATCH "$api/$number" -f state=closed --silent
            if [ -n "$next_number" ]; then
              gh api -X PATCH "$api/$next_number" -f state=open --silent
            else
              gh api "$api" -f title="$next" --silent
            fi
          fi
