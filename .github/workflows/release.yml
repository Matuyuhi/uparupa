name: release

# Run by hand (the "Run workflow" button in Actions, or gh workflow run release.yml).
# Reads .version from build.zig.zon, runs the tests, builds, then creates the v<version> tag and Release.
# Fails if a tag with the same version already exists. After the release, bump-version.yml moves main to the next patch version.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Claude writes the release notes from the commits since the previous tag.
  # It runs in its own job so that it holds a read-only token, not the one that creates the Release.
  notes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.claude.outputs.structured_output }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # A failure here must not stop the release: it then goes out with only GitHub's generated notes.
      - uses: anthropics/claude-code-action@v1.0.290
        id: claude
        continue-on-error: true
        timeout-minutes: 10
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: >-
            --json-schema '{"type":"object","properties":{"notes":{"type":"string"}},"required":["notes"],"additionalProperties":false}'
          prompt: |
            Write the release notes for the next release of upaa, a terminal emulator for macOS.
            The changes are the commits after the latest tag (`git describe --tags --abbrev=0`) up to HEAD.
            Read their messages, and read the diff where a message does not say what changed for users.
            Write for people who use upaa: say what changed for them, in plain English, as a short Markdown list.
            Group items under "### Breaking", "### Added", "### Changed" and "### Fixed", leaving out a heading that has no items.
            "### Breaking" is for changes that make something stop working as before, such as the config format.
            Leave out commits that change nothing for users (version bumps, CI, tests, refactoring).
            Return the notes alone in `notes`, with no title and no preamble. Do not change any file.

  # Release only when the milestone named after the version has nothing open (see "Version and release" in CLAUDE.md).
  milestone:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check that the milestone is done
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/.*\.version = "\([^"]*\)".*/\1/p' build.zig.zon)"
          set -- $(gh api --paginate "repos/$GITHUB_REPOSITORY/milestones?state=all&per_page=100" \
            --jq ".[] | select(.title == \"$version\") | \"\\(.number) \\(.open_issues)\"")
          number="${1:-}"; open="${2:-}"
          [ -n "$number" ] || { echo "No milestone is named $version"; exit 1; }
          [ "$open" = 0 ] || { echo "Milestone $version still has $open open issues or pull requests"; exit 1; }
          # A patch release holds only fixes: every item it ships (a merged pull request or a completed issue) has the label bug.
          if [ "${version##*.}" != 0 ]; then
            others="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues?milestone=$number&state=all&per_page=100" \
              --jq '.[] | select(if .pull_request then .pull_request.merged_at else .state_reason == "completed" end)
                | select(all(.labels[]; .name != "bug")) | "#\(.number)"' | tr '\n' ' ')"
            [ -z "$others" ] || { echo "$version is a patch version, but $others are not labelled bug. Run bump-version.yml with part=minor"; exit 1; }
          fi

  release:
    needs: [notes, milestone]
    # Do not release from anything other than main.
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
    timeout-minutes: 30
    permissions:
      # Create the tag and Release
      contents: write
      # Attach build provenance (attestation)
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Determine the version to release
        id: version
        run: |
          version="$(sed -n 's/.*\.version = "\([^"]*\)".*/\1/p' build.zig.zon)"
          [ -n "$version" ] || { echo "Cannot read the version from build.zig.zon"; exit 1; }
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$version is already released. Bump the version in build.zig.zon"; exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Build the release artifacts from a clean state every time. Do not use the cache from the test workflow.
      - name: Install Zig and minisign
        run: |
          brew install zig minisign
          zig version | grep -q '^0\.17\.' || { echo "Zig 0.17.x is required: $(zig version)"; exit 1; }

      - name: Install Metal Toolchain
        run: xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain

      - name: Fetch libghostty-vt
        run: sh scripts/fetch-ghostty-vt.sh

      - name: Test (the release build is also made here)
        run: sh scripts/test.sh

      - name: Check the version of the built app
        run: |
          built="$(build/upaa.app/Contents/MacOS/upaa --version)"
          [ "$built" = "${{ steps.version.outputs.version }}" ] || { echo "The built version is $built, not ${{ steps.version.outputs.version }} from build.zig.zon"; exit 1; }

      - name: Create the files to distribute
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/upaa.app dist/upaa-macos-arm64.zip
          cd dist && shasum -a 256 upaa-macos-arm64.zip > SHA256SUMS && cat SHA256SUMS

      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: dist/upaa-macos-arm64.zip

      # The tag is placed on the commit this workflow runs on.
      # GitHub's generated notes (the "Full Changelog" link) are appended after Claude's notes.
      - name: Create the tag and Release
        env:
          NOTES: ${{ needs.notes.outputs.notes }}
        run: |
          if printf '%s' "$NOTES" | jq -er '.notes | select(test("\\S"))' > "$RUNNER_TEMP/notes.md"; then
            set -- --notes-file "$RUNNER_TEMP/notes.md"
          else
            set --
          fi
          gh release create "${{ steps.version.outputs.tag }}" dist/upaa-macos-arm64.zip dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes "$@"

  # Move main to the next patch version, so the next release does not collide with this one.
  bump-version:
    needs: release
    permissions:
      contents: write
      actions: write
      statuses: write
      issues: write
    uses: ./.github/workflows/bump-version.yml
    with:
      part: patch
